[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-optimizer"
version = "0.1.0"
description = "Comparative benchmark for LLM context compression and targeted log retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Deepaksha" }
]
dependencies = [
  "langchain-core>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-ollama>=0.3.0",
  "langchain-groq>=0.2.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
evaluation = [
  "matplotlib>=3.8.0",
  "pillow>=10.0.0",
]

[project.scripts]
context-optimizer = "context_optimizer.cli:main"

[tool.setuptools]
packages = ["context_optimizer"]
py-modules = ["context_optimizer_benchmark"]
