name: context-optimizer-azure

# Azure Key Vault–backed deployment.
#
# Startup sequence:
#   1. `secrets-init` authenticates to Azure Key Vault and writes per-service
#      .env files under azure_deployments/services/.
#   2. App containers start once secrets-init exits successfully.
#
# Before first run:
#   cp .env.example .env.azure          # fill in tenant/client/kv details
#   bash keyvault/provision.sh          # one-time: create secrets in your vault
#   docker compose -f deployments/azure/docker-compose.yml up --build
#   # or use the unified entry point:
#   bash deployments/deploy.sh azure up
#
# Build context is the project root so every Dockerfile can reach src/.

services:

  # ── Init: fetch secrets from Azure Key Vault ─────────────────────────────
  secrets-init:
    image: mcr.microsoft.com/azure-cli:latest
    env_file: .env.azure                   # AZURE_CLIENT_ID/SECRET/TENANT/KV_URI
    volumes:
      - ./keyvault:/keyvault:ro            # provision + fetch scripts
      - ./services:/services               # writable: receives generated .env files
    command: bash /keyvault/fetch-secrets.sh
    networks: [co-net]

  # ── Service 1: Ingestion ──────────────────────────────────────────────────
  # Rolling-window LLM compression → vector store.
  # Uses the Azure summarizer model for compression.
  ingestion:
    build:
      context: ../..
      dockerfile: deployments/docker/ingestion/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - services/ingestion.env             # written by secrets-init
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      embedding:
        condition: service_healthy
      vector-store:
        condition: service_healthy
    networks: [co-net]
    restart: unless-stopped

  # ── Service 2: Embedding ──────────────────────────────────────────────────
  # Dense vectorisation via Azure AI text-embedding-3-small.
  embedding:
    build:
      context: ../..
      dockerfile: deployments/docker/embedding/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - services/embedding.env             # written by secrets-init
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [co-net]
    restart: unless-stopped

  # ── Service 3: Vector Store ───────────────────────────────────────────────
  # ChromaDB HNSW index + in-memory semantic LRU cache.
  vector-store:
    build:
      context: ../..
      dockerfile: deployments/docker/vector-store/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - services/vector-store.env          # written by secrets-init
    volumes:
      - chroma-data:/data/chroma_db
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [co-net]
    restart: unless-stopped

  # ── Service 4: Reasoning Gateway (main app) ───────────────────────────────
  # LiteLLM router + MCP tool bridge. OpenAI-compatible entry point.
  # Connects to the Azure reasoning model; retrieves evidence from vector-store.
  reasoning-gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/reasoning-gateway/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - services/reasoning-gateway.env     # written by secrets-init
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      vector-store:
        condition: service_healthy
    networks: [co-net]
    restart: unless-stopped

volumes:
  chroma-data:
    driver: local

networks:
  co-net:
    driver: bridge
