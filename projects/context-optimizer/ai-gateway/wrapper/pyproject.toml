[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-optimizer-gateway"
version = "0.1.0"
description = "LiteLLM wrapper with semantic compression for 50-98% token reduction"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Context Optimizer Team"}
]
keywords = ["llm", "compression", "litellm", "ai-gateway", "cost-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "litellm>=1.0.0",
    "redis>=4.0.0; extra == 'redis'",
]

[project.optional-dependencies]
redis = ["redis>=4.0.0"]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/context-optimizer"
Documentation = "https://github.com/yourusername/context-optimizer/tree/main/ai-gateway"
Repository = "https://github.com/yourusername/context-optimizer"

[tool.setuptools.packages.find]
where = ["."]
include = ["context_optimizer_gateway*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
