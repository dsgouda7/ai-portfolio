runtime:
  processing_fps: 5.0
  max_active_tracks: 32
  max_evidence_per_track: 16
  heartbeat_seconds: 10
  event_capacity: 5000

detector:
  model_id: facebook/detr-resnet-50
  revision: no_timm
  score_threshold: 0.70
  vehicle_classes: [car, truck, bus]
  offline_only: true

tracker:
  implementation: bytetrack
  activation_threshold: 0.25
  matching_threshold: 0.80
  lost_track_buffer: 20

quality:
  minimum_height_px: 12
  maximum_blur: 0.80
  maximum_exposure: 0.85
  maximum_occlusion: 0.75

privacy:
  require_for_public_sources: true
  allow_raw_local_display: false
