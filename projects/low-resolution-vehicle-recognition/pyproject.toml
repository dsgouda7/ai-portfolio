[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadid"
version = "0.1.0"
description = "Low-resolution multi-frame vehicle recognition with visible inference traces"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4,<3",
  "transformers>=4.46,<5",
  "safetensors>=0.4,<1",
]
tracking = ["supervision>=0.24,<1"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "playwright>=1.49,<2",
]

[project.scripts]
roadid-web = "roadid.web:main"
roadid-train = "roadid.training.cli:main"
roadid-evaluate = "roadid.training.evaluate_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
