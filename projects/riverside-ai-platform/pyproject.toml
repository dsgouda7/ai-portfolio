[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "riverside-ai-platform"
version = "0.1.0"
description = "Contract-first Azure orchestration host and release tooling for Riverside House."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "azure-identity>=1.19,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema[format]>=4.23,<5",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "pydantic>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "referencing>=0.35,<1",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
azureml = [
  "azureml-inference-server-http>=1.4,<2",
  "peft>=0.14,<1",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.47,<5",
]
telemetry = [
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
riverside = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = [
  "tests/unit",
  "tests/contract",
  "tests/integration",
  "tests/cloud",
]
markers = [
  "asyncio: asynchronous test executed by pytest-asyncio",
  "integration: cloud-free composition tests across Riverside packages",
  "cloud: authorized tests against deployed Azure and Databricks resources",
]
