config_version: 1.0.0
project_name: riverside-ai-platform
environment: dev
region: eastus2
identity:
  authentication: workload_identity
model:
  alias: riverside-editor
  release_manifest_uri: ${RIVERSIDE_RELEASE_MANIFEST_URI}
  max_input_tokens: 4096
  max_output_tokens: 512
  precision: fp32
data:
  contract_version: 1.0.0
  index_name: riverside.dev.riverside_manuscripts_v1
  index_version: 1.0.0
gateway:
  base_url: ${RIVERSIDE_GATEWAY_BASE_URL}
  route: /v1/chat/completions
  timeout_seconds: 60
  max_retries: 1
serving:
  endpoint_name: ${RIVERSIDE_SERVING_ENDPOINT_NAME}
  blue_deployment: ${RIVERSIDE_BLUE_DEPLOYMENT_NAME}
  green_deployment: ${RIVERSIDE_GREEN_DEPLOYMENT_NAME}
  request_timeout_seconds: 50
retrieval:
  top_k: 6
  search_type: hybrid
telemetry:
  enabled: true
  service_name: riverside-rag-orchestrator
  exporter_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
evaluation:
  release_report_uri: ${RIVERSIDE_EVALUATION_REPORT_URI}
  required_domains: &required_domains
    - data_quality
    - retrieval_quality
    - generation_citation_quality
    - adaptation_evidence
    - safety_authorization
    - operational_slos
    - cost
    - rollout_comparison
