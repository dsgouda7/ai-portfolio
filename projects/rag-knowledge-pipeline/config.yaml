# Pipeline execution mode
mode: local  # Options: local | remote

# Local execution (Delta Lake + ChromaDB, no Databricks account required)
local:
  dataset: wikipedia  # Options: wikipedia | pubmed | arxiv
  sample_size: 10   # Number of documents to ingest (reduced for testing)
  delta_path: ./data/delta_lake
  vector_store_path: ./data/chroma_db
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_size: 1024
  chunk_overlap: 128

# Remote execution (Databricks workspace integration)
remote:
  workspace_url: ${DATABRICKS_HOST}
  vector_search_endpoint: ${RIVERSIDE_VECTOR_SEARCH_ENDPOINT}
  vector_search_endpoint_type: standard  # Options: standard | storage-optimized
  catalog: main
  schema: rag_demo
  volume: rag_data
  embedding_model: databricks-gte-large-en
  embedding_model_revision: ""
  embedding_dimensions: ""
  embedding_endpoint: ""
  index_name: ""
  index_version: 1.0.0
  pipeline_version: 1.0.0
  chunk_strategy_version: 1.0.0

# Serving selects retrieval from the pipeline mode and generation independently.
serving:
  retrieval:
    provider: auto  # local -> ChromaDB; remote -> Databricks AI Search
  generation:
    provider: openai_compatible  # Options: openai_compatible | azure_endpoint | watsonx_legacy
    model_alias: riverside-editor
    max_input_tokens: 8192
    max_tokens: 512
    temperature: 0.1
    timeout_seconds: 30
    max_retries: 2
    endpoint:
      provider: local  # Options for azure_endpoint: apim | azure_ml | foundry
      url: http://host.docker.internal:8001
      route: /v1/chat/completions
      auth: none
      token_scope: ""
      azureml_deployment: ""
      foundry_deployment: ""
      foundry_api_version: 2024-10-21
    # Legacy provider is disabled unless provider is explicitly set to watsonx_legacy.
    watsonx_legacy:
      url: https://us-south.ml.cloud.ibm.com
      project_id: skills-network
      model_id: meta-llama/llama-4-maverick-17b-128e-instruct-fp8
  deployment:
    environment: dev
    release_id: local-development
    deployment_slot: blue
    runtime: rag-phase3-serve
    runtime_version: 0.2.0
    source_commit: "0000000"

# Retrieval parameters
retrieval:
  search_type: mmr  # Options: similarity | mmr
  top_k: 6
  lambda_mult: 0.25  # For MMR: diversity vs relevance (0=diverse, 1=relevant)

# Logging
logging:
  level: INFO  # Options: DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
