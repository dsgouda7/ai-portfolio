[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riverside_rag_vectorize"
version = "1.0.0"
description = "Contract-native Delta-to-Databricks-AI-Search indexing"
requires-python = ">=3.11"
dependencies = [
  "databricks-ai-search>=0.57.0,<1.0.0",
  "databricks-sdk>=0.57.0,<1.0.0",
  "mlflow>=2.11.0,<4.0.0",
]

[project.scripts]
bootstrap_index = "remote.bootstrap:main"
evaluate_index = "remote.evaluation_job:main"
remote_index = "remote.job:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["remote*"]
