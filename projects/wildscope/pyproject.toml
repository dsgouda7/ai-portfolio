[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildscope"
version = "0.1.0"
description = "Test-then-train wildlife identification over recent iNaturalist observations"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "speciesnet>=5.0.5,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "playwright>=1.49,<2",
]

[project.scripts]
wildscope-web = "wildscope.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
