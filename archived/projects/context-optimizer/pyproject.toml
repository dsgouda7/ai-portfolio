[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-optimizer"
version = "0.1.0"
description = "LLM corpus compression and targeted retrieval library"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Deepaksha" }
]

[project.urls]
Homepage = "https://github.com/your-org/context-optimizer"
Documentation = "https://github.com/your-org/context-optimizer#readme"
Issues = "https://github.com/your-org/context-optimizer/issues"

dependencies = [
  "pydantic>=2.7.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=2.2.0",
  # python-dotenv: auto-loads .env files so users don't have to export env vars manually
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# ── Local SLM summarization (CPU-friendly, no daemon required) ────────────────
hf = [
  "transformers>=4.40.0",
  "torch>=2.2.0",
]
# Code-aware summarization (CodeT5 / PLBART) — auto-selected for .py/.ts/.go etc.
hf-code = [
  "transformers>=4.40.0",
  "torch>=2.2.0",
]
# ── Remote/local LLM provider backends ────────────────────────────────────────
ollama   = ["langchain-ollama>=0.3.0"]
groq     = ["langchain-groq>=0.2.0"]
openai   = ["langchain-openai>=0.3.0", "openai>=1.0"]
litellm  = ["litellm>=1.0.0"]
# ── Framework adapter extras (optional — core works without any of these) ─────
langchain = ["langchain-core>=0.3.0", "langchain-community>=0.3.0"]
# ── MCP server (exposes tree tools to any MCP-compatible agent) ────────────────
mcp = [
  "mcp>=1.0.0",
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
]
# ── Evaluation / benchmark tools ──────────────────────────────────────────────
evaluation = [
  "matplotlib>=3.8.0",
  "pillow>=10.0.0",
]
# ── Everything ─────────────────────────────────────────────────────────────────
full = [
  "context-optimizer[hf,hf-code,ollama,groq,openai,litellm,langchain,mcp,evaluation]",
]

[project.scripts]
context-optimizer = "context_optimizer.cli:main"
# Registered as a stdio MCP server — clients (VS Code, Claude Desktop, Cursor)
# can spawn this directly without a running HTTP server.
context-optimizer-mcp = "context_optimizer.mcp_server:serve_stdio"

[tool.setuptools]
packages = [
  "context_optimizer",
  "context_optimizer.adapters",
  "context_optimizer.extractors",
  "context_optimizer.providers",
]

[tool.setuptools.package-dir]
"context_optimizer"            = "src"
"context_optimizer.adapters"   = "src/adapters"
"context_optimizer.extractors" = "src/extractors"
"context_optimizer.providers"  = "src/providers"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
