# Context-Optimizer Benchmark Configuration
# -----------------------------------------
# Run with:  python benchmarks/corpus_benchmark.py run
# This file auto-loads from benchmarks/. No CLI flags needed.
#
# BARE MINIMUM:  set benchmark.corpus_path.  Everything else has defaults.
# See src/README.md for full documentation of every option.


# == COMPRESSOR ================================================================
# Builds the block summaries stored in the index.
# Two-model design: prose/docs use 'model', source code uses 'code_model'.
#
# Provider choices:
#   hf            BART encoder-decoder. 5-15x faster than Ollama on CPU for pure
#                 prose. ~400 MB RAM, no daemon required. Best default.
#   ollama        Local quantized SLM (Q4_K_M). More flexible prompting, more RAM.
#   azure_foundry Cloud endpoint. <1 s/block. Needs AZURE_AI_FOUNDRY_API_KEY.
compressor:
  provider: hf              # hf | ollama | azure_foundry

  hf:
    model: facebook/bart-large-cnn   # HuggingFace Hub model ID
    device: -1                       # -1 = CPU,  0 = first CUDA GPU

  ollama:
    # CPU throughput (Q4_K_M, 8-core x86):  qwen2.5:3b ~35-45 tok/s
    model: qwen2.5:3b                # prose / docs / spreadsheets / markup
    code_model: qwen2.5-coder:3b     # source code (.py .c .h .js ...) same size, better quality
    base_url: http://localhost:11434

  azure_foundry:
    # Endpoint: https://<project>.<region>.models.ai.azure.com
    endpoint: https://your-project.eastus2.models.ai.azure.com
    model: phi-4-mini                # ~$0.0003/1K tokens — best bang-for-buck
    code_model: phi-4-mini


# == REASONING =================================================================
# LLM that navigates the tree index at query time and synthesizes answers.
# Larger models give better answers; cloud providers eliminate local GPU need.
# Set model to "" to disable reasoning (retrieval metrics only, no Ollama needed).
reasoning:
  ollama:
    model: mistral:7b
    base_url: http://localhost:11434


# == BENCHMARK =================================================================
benchmark:

  # -- Paths -------------------------------------------------------------------
  corpus_path: benchmarks/data/corpus/gutenberg_combined.txt
  # REQUIRED. Path to a text file (or directory when using ingest_corpus).
  # Relative paths resolve from the project root (context-optimizer/).

  index_dir: benchmarks/data/index/gutenberg-0.5mb
  # Where to persist the built index (ChromaDB collections + BlockIndex SQLite).
  # If a valid index already exists here ingestion is skipped automatically.
  # Omit to use a temp dir — the index is lost on process restart.

  # -- Block / tree parameters -------------------------------------------------
  block_mb: 0.5
  # Corpus block size fed to the compressor, in megabytes.
  # Smaller = more precise summaries, more LLM calls during build.
  # 0.5 MB is good for text-only corpora. 2 MB is usable with tree navigation.

  cluster_size: 4
  # Children per tree node.  THE primary accuracy knob.
  # Lower = each cluster summary covers fewer children = more specific = better recall.
  # Larger = shallower tree = fewer LLM calls during build.
  # 4 is recommended. Try 2-3 for maximum accuracy, 8-10 for fastest build.

  overlap_pct: 10.0
  # Percentage of each block prepended to the next block as context overlap.
  # Prevents concepts at block boundaries from being missed by the summarizer.

  tree_depth: 0
  # Number of summary levels above the raw blocks.  0 = auto (recommended).
  # Auto computes:  depth = ceil(log(n_blocks/k) / log(k)) + 1  after Pass 1.
  # This keeps the top level at ~cluster_size entries for the tree agent.
  # Set to 2 for small corpora (L1+L2 only), 3 for 400 MB+.

  # -- Evaluation parameters ---------------------------------------------------
  questions: 20
  # Number of evaluation questions to run.
  # Questions come from the question bank built by: python corpus_benchmark.py prepare

  top_k: 5
  # Number of chunks / blocks retrieved per query in both flat and tree strategies.

  fallback_threshold: 0.30
  # Cosine distance threshold for the optimized RAG raw-block fallback.
  # If the best compressed-summary match distance exceeds this value the full
  # raw block is fetched from disk to improve recall.
  # 0.0 = never fall back.  1.0 = always fall back.  0.30 is a balanced default.

  opt_strategy: llm
  # Summarization strategy for the optimized RAG (flat) index.
  # llm       BART or Ollama compresses each block (default, better quality).
  # raw_only  Store the first 800 chars of each block verbatim (no LLM calls,
  #           instant build but poor recall on semantic queries).

  # -- Run mode ----------------------------------------------------------------
  tree: true
  # Build and evaluate the Tree-of-Summaries index (recommended).
  # Set to false to build only the flat optimized RAG.

  optimized_only: true
  # Skip vanilla RAG (512-token raw-chunk baseline).
  # Vanilla RAG takes ~80 min to index at 400 MB.  Set to false only when
  # you need a fresh baseline comparison against the tree results.

  vanilla_only: false
  # Run only vanilla RAG; skip optimized and tree.  Baseline-only mode.

  build_only: false
  # Build the index and exit without running evaluation.
  # Pair with eval_only: true on the next run to separate the two phases.

  eval_only: false
  # Skip building; load existing index from index_dir and run evaluation only.
  # Requires a previously built index at index_dir.

  force_fallback: false
  # Always fetch the full raw block regardless of cosine score.
  # Diagnostic flag: measures the recall gain from BlockIndex vs summaries alone.

  max_mb: 0
  # Cap the corpus at N MB before indexing (0 = no cap, use the full file).
  # Useful for quick test runs on large corpora.
