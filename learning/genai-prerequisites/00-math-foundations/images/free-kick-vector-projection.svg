<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dot product as the shadow of a kick direction along the intended route</title>
  <desc id="desc">A kick arrow projects a long forward shadow onto the target direction. Three smaller examples compare same direction, sideways, and opposite direction.</desc>
  <defs>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#43cbd8"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#f2b83e"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#ed6955"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#061923" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#eaf1eb"/>
  <path d="M0 0H1600V128H0z" fill="#082d3c"/>
  <text x="58" y="38" fill="#f2b83e" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">BEFORE THE KICK</text>
  <text x="58" y="91" fill="#f7faf5" font-family="Georgia, serif" font-size="48" font-weight="700">How much does the kick point along the intended route?</text>

  <g filter="url(#shadow)">
    <rect x="56" y="174" width="1000" height="520" rx="12" fill="#ffffff" stroke="#9bb0ad" stroke-width="3"/>
  </g>
  <text x="92" y="220" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">THE PROJECTION PICTURE</text>
  <text x="92" y="265" fill="#0b202b" font-family="Georgia, serif" font-size="32" font-weight="700">Drop the kick arrow's shadow onto the target line</text>

  <circle cx="230" cy="570" r="22" fill="#f7faf5" stroke="#0b202b" stroke-width="4"/>
  <line x1="230" y1="570" x2="860" y2="570" stroke="#f2b83e" stroke-width="14" marker-end="url(#arrow-gold)"/>
  <text x="875" y="579" fill="#8d6818" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">intended route</text>

  <line x1="230" y1="570" x2="780" y2="310" stroke="#43cbd8" stroke-width="14" marker-end="url(#arrow-cyan)"/>
  <text x="605" y="340" fill="#147f8a" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">kick direction</text>

  <line x1="780" y1="322" x2="780" y2="570" stroke="#60797b" stroke-width="4" stroke-dasharray="12 10"/>
  <path d="M746 536H780V570" fill="none" stroke="#60797b" stroke-width="4"/>

  <line x1="230" y1="570" x2="780" y2="570" stroke="#4ecf8e" stroke-width="22" opacity="0.88"/>
  <text x="505" y="625" text-anchor="middle" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="25" font-weight="700">forward shadow = the part that helps</text>
  <text x="92" y="650" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="20">A long forward shadow means strong agreement.</text>
  <text x="92" y="680" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="20">For unit arrows, the dot product is that signed shadow length.</text>

  <g transform="translate(1110 174)" filter="url(#shadow)">
    <rect width="434" height="520" rx="12" fill="#ffffff" stroke="#9bb0ad" stroke-width="3"/>
    <text x="28" y="48" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">THREE QUICK TESTS</text>

    <g transform="translate(26 70)">
      <line x1="30" y1="46" x2="310" y2="46" stroke="#f2b83e" stroke-width="9" marker-end="url(#arrow-gold)"/>
      <line x1="30" y1="46" x2="275" y2="46" stroke="#43cbd8" stroke-width="9" marker-end="url(#arrow-cyan)"/>
      <text x="30" y="98" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="700">Same way: large positive</text>
    </g>

    <g transform="translate(26 245)">
      <line x1="30" y1="46" x2="310" y2="46" stroke="#f2b83e" stroke-width="9" marker-end="url(#arrow-gold)"/>
      <line x1="30" y1="46" x2="30" y2="-42" stroke="#43cbd8" stroke-width="9" marker-end="url(#arrow-cyan)"/>
      <circle cx="30" cy="46" r="7" fill="#0b202b"/>
      <text x="30" y="98" fill="#60797b" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="700">Sideways: zero shadow</text>
    </g>

    <g transform="translate(26 410)">
      <line x1="30" y1="46" x2="310" y2="46" stroke="#f2b83e" stroke-width="9" marker-end="url(#arrow-gold)"/>
      <line x1="310" y1="46" x2="70" y2="46" stroke="#ed6955" stroke-width="9" marker-end="url(#arrow-coral)"/>
      <text x="30" y="98" fill="#a94131" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="700">Opposite way: negative</text>
    </g>
  </g>

  <rect x="0" y="760" width="1600" height="140" fill="#082d3c"/>
  <text x="58" y="813" fill="#4ecf8e" font-family="Georgia, serif" font-size="34" font-weight="700">Picture first</text>
  <text x="285" y="815" fill="#f7faf5" font-family="Trebuchet MS, sans-serif" font-size="25">The dot product answers: “How much of this arrow lies along that arrow?”</text>
  <text x="58" y="862" fill="#a7bdbe" font-family="Trebuchet MS, sans-serif" font-size="20">Direction gives the sign. The shadow length gives the strength of agreement.</text>
</svg>
