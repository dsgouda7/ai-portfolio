<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Gravity-only free-kick trajectory with near-peak wall clearance</title>
  <desc id="desc">A 20 metre per second kick launched at 19.11 degrees clears the wall at 2.02 metres, rises only 0.16 metres more to its peak, crosses below the crossbar, and reaches the target.</desc>
  <defs>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#43cbd8"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f2b83e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#061923" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#eaf1eb"/>
  <path d="M0 0H1600V128H0z" fill="#082d3c"/>
  <text x="58" y="38" fill="#f2b83e" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">ONE KICK · CONSTANT GRAVITY</text>
  <text x="58" y="91" fill="#f7faf5" font-family="Georgia, serif" font-size="48" font-weight="700">Build the flight from repeated local updates</text>

  <g filter="url(#shadow)">
    <rect x="56" y="164" width="1488" height="554" rx="8" fill="#ffffff" stroke="#9bb0ad" stroke-width="3"/>
  </g>

  <text x="92" y="210" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">SAMPLED EVERY 4 OF 28 EQUAL TIME STEPS</text>
  <line x1="120" y1="680" x2="1470" y2="680" stroke="#60797b" stroke-width="2"/>
  <line x1="120" y1="680" x2="120" y2="180" stroke="#b9c8c5" stroke-width="3"/>

  <line x1="673" y1="680" x2="673" y2="320" stroke="#0b202b" stroke-width="8"/>
  <text x="673" y="708" text-anchor="middle" fill="#0b202b" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="700">WALL · 9.15 m</text>

  <line x1="1329" y1="680" x2="1329" y2="192" stroke="#0b202b" stroke-width="7"/>
  <line x1="1329" y1="192" x2="1460" y2="192" stroke="#0b202b" stroke-width="7"/>
  <text x="1305" y="174" text-anchor="end" fill="#0b202b" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="700">GOAL LINE · 20 m</text>

  <polyline points="120,680 306,493 492,358 677,275 863,243 1049,264 1234,336 1420,460" fill="none" stroke="#60797b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#43cbd8" stroke="#0b202b" stroke-width="2">
    <circle cx="120" cy="680" r="6"/>
    <circle cx="306" cy="493" r="6"/>
    <circle cx="492" cy="358" r="6"/>
    <circle cx="677" cy="275" r="6"/>
    <circle cx="863" cy="243" r="6"/>
    <circle cx="1049" cy="264" r="6"/>
    <circle cx="1234" cy="336" r="6"/>
  </g>

  <line x1="120" y1="680" x2="166" y2="680" stroke="#43cbd8" stroke-width="5" marker-end="url(#arrow-cyan)"/>
  <line x1="166" y1="680" x2="166" y2="628" stroke="#f2b83e" stroke-width="5" marker-end="url(#arrow-gold)"/>
  <text x="205" y="645" fill="#147f8a" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="700">first local update</text>

  <circle cx="1420" cy="460" r="12" fill="#4ecf8e" stroke="#0b202b" stroke-width="3"/>
  <text x="1410" y="510" text-anchor="end" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="21" font-weight="700">TARGET · (21.5 m, 1.10 m)</text>

  <text x="760" y="190" text-anchor="start" fill="#0b202b" font-family="Trebuchet MS, sans-serif" font-size="19" font-weight="700">PEAK · 2.18 m (+0.16 m)</text>
  <text x="650" y="235" text-anchor="end" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">NEAR-TOP WALL CLEARANCE · 2.02 m</text>
  <text x="1295" y="315" text-anchor="end" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">inside goal</text>

  <rect x="0" y="760" width="1600" height="140" fill="#082d3c"/>
  <text x="58" y="813" fill="#4ecf8e" font-family="Georgia, serif" font-size="34" font-weight="700">Solved launch: 19.11°</text>
  <text x="520" y="815" fill="#f7faf5" font-family="Trebuchet MS, sans-serif" font-size="25">Speed 20 m/s · gravity 9.81 m/s² · no other forces</text>
  <text x="58" y="862" fill="#a7bdbe" font-family="Trebuchet MS, sans-serif" font-size="20">Each endpoint becomes the next starting point until the ball reaches the target.</text>
</svg>
