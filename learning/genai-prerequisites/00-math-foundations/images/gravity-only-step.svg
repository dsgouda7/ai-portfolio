<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">One gravity-only position update</title>
  <desc id="desc">A thin cyan arrow moves 0.768 metres forward and a thin gold arrow moves 0.112 metres upward after gravity trims the vertical carry.</desc>
  <defs>
    <marker id="arrow-cyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#219ebc"/>
    </marker>
    <marker id="arrow-gold" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#d99a16"/>
    </marker>
  </defs>

  <rect width="1100" height="500" fill="#f4f8f5"/>
  <text x="56" y="54" fill="#50666a" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">ONE 0.041 s FRAME</text>
  <text x="56" y="94" fill="#102a36" font-family="Georgia, serif" font-size="31" font-weight="700">Velocity carries the ball; gravity trims the rise</text>

  <line x1="90" y1="360" x2="700" y2="360" stroke="#b6c4c2" stroke-width="2"/>

  <circle cx="140" cy="340" r="8" fill="#102a36"/>
  <text x="140" y="390" text-anchor="middle" fill="#102a36" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">NOW</text>

  <line x1="140" y1="340" x2="600" y2="340" stroke="#219ebc" stroke-width="4" marker-end="url(#arrow-cyan)"/>
  <text x="370" y="312" text-anchor="middle" fill="#126f83" font-family="Trebuchet MS, sans-serif" font-size="22" font-weight="700">forward move · +0.768 m</text>

  <line x1="600" y1="340" x2="600" y2="245" stroke="#d99a16" stroke-width="4" marker-end="url(#arrow-gold)"/>
  <text x="570" y="275" text-anchor="end" fill="#8a6413" font-family="Trebuchet MS, sans-serif" font-size="21" font-weight="700">net rise · +0.112 m</text>

  <circle cx="600" cy="245" r="9" fill="#36b37e" stroke="#102a36" stroke-width="2"/>
  <text x="600" y="218" text-anchor="middle" fill="#207a57" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">NEXT</text>

  <line x1="750" y1="145" x2="750" y2="420" stroke="#c8d3d1" stroke-width="2"/>

  <text x="790" y="180" fill="#50666a" font-family="Trebuchet MS, sans-serif" font-size="17" font-weight="700">VERTICAL BALANCE</text>
  <text x="790" y="230" fill="#102a36" font-family="Trebuchet MS, sans-serif" font-size="21">upward carry</text>
  <text x="1030" y="230" text-anchor="end" fill="#207a57" font-family="Trebuchet MS, sans-serif" font-size="21" font-weight="700">+0.120 m</text>

  <text x="790" y="285" fill="#102a36" font-family="Trebuchet MS, sans-serif" font-size="21">gravity drop</text>
  <text x="1030" y="285" text-anchor="end" fill="#b34a3c" font-family="Trebuchet MS, sans-serif" font-size="21" font-weight="700">−0.008 m</text>

  <line x1="790" y1="315" x2="1030" y2="315" stroke="#8fa3a1" stroke-width="2"/>
  <text x="790" y="360" fill="#102a36" font-family="Trebuchet MS, sans-serif" font-size="21" font-weight="700">net rise</text>
  <text x="1030" y="360" text-anchor="end" fill="#8a6413" font-family="Trebuchet MS, sans-serif" font-size="21" font-weight="700">+0.112 m</text>
</svg>
