<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One exact gravity-only trajectory step</title>
  <desc id="desc">At step 10, horizontal velocity moves the ball 0.768 metres forward. Vertical velocity would move it 0.120 metres upward, while gravity subtracts 0.008 metres, leaving a net upward move of 0.112 metres.</desc>
  <defs>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#43cbd8"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f2b83e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#061923" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#eaf1eb"/>
  <path d="M0 0H1600V128H0z" fill="#082d3c"/>
  <text x="58" y="38" fill="#f2b83e" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">GRAVITY-ONLY FLIGHT</text>
  <text x="58" y="91" fill="#f7faf5" font-family="Georgia, serif" font-size="48" font-weight="700">One exact update at step 10</text>

  <g filter="url(#shadow)">
    <rect x="56" y="174" width="970" height="520" rx="8" fill="#ffffff" stroke="#9bb0ad" stroke-width="3"/>
    <rect x="1060" y="174" width="484" height="520" rx="8" fill="#ffffff" stroke="#9bb0ad" stroke-width="3"/>
  </g>

  <text x="92" y="220" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">POSITION CHANGE DURING Δt = 0.0406 s</text>
  <line x1="170" y1="560" x2="840" y2="560" stroke="#b9c8c5" stroke-width="3"/>
  <line x1="230" y1="620" x2="230" y2="270" stroke="#b9c8c5" stroke-width="3"/>

  <circle cx="300" cy="540" r="10" fill="#0b202b"/>
  <text x="300" y="585" text-anchor="middle" fill="#0b202b" font-family="Trebuchet MS, sans-serif" font-size="20" font-weight="700">NOW</text>

  <line x1="300" y1="540" x2="680" y2="540" stroke="#43cbd8" stroke-width="6" marker-end="url(#arrow-cyan)"/>
  <text x="490" y="515" text-anchor="middle" fill="#147f8a" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">Δx = +0.768 m</text>

  <line x1="680" y1="540" x2="680" y2="484" stroke="#f2b83e" stroke-width="6" marker-end="url(#arrow-gold)"/>
  <text x="705" y="520" fill="#8d6818" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">Δy = +0.112 m</text>

  <circle cx="680" cy="484" r="10" fill="#4ecf8e" stroke="#0b202b" stroke-width="2"/>
  <text x="680" y="448" text-anchor="middle" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="20" font-weight="700">NEXT</text>

  <text x="1095" y="220" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">VERTICAL UPDATE</text>
  <text x="1095" y="270" fill="#0b202b" font-family="Georgia, serif" font-size="24" font-weight="700">Current vertical carry</text>
  <text x="1095" y="305" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">+0.120 m</text>
  <line x1="1095" y1="330" x2="1495" y2="330" stroke="#d6dfdc" stroke-width="2"/>

  <text x="1095" y="380" fill="#0b202b" font-family="Georgia, serif" font-size="24" font-weight="700">Gravity drop</text>
  <text x="1095" y="415" fill="#a94131" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">−0.008 m</text>
  <line x1="1095" y1="440" x2="1495" y2="440" stroke="#d6dfdc" stroke-width="2"/>

  <text x="1095" y="490" fill="#0b202b" font-family="Georgia, serif" font-size="24" font-weight="700">Net height change</text>
  <text x="1095" y="525" fill="#8d6818" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700">+0.112 m</text>

  <rect x="1095" y="555" width="400" height="90" rx="8" fill="#eef7f2" stroke="#8bbba3" stroke-width="2"/>
  <text x="1120" y="590" fill="#0b202b" font-family="Trebuchet MS, sans-serif" font-size="19">upward carry − gravity drop = net rise</text>
  <text x="1120" y="623" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="21" font-weight="700">0.120 − 0.008 = 0.112 m</text>

  <rect x="0" y="760" width="1600" height="140" fill="#082d3c"/>
  <text x="58" y="813" fill="#4ecf8e" font-family="Georgia, serif" font-size="34" font-weight="700">Same rule, every step</text>
  <text x="500" y="815" fill="#f7faf5" font-family="Trebuchet MS, sans-serif" font-size="23">Velocity carries the ball; gravity reduces the upward move.</text>
  <text x="58" y="862" fill="#a7bdbe" font-family="Trebuchet MS, sans-serif" font-size="20">The endpoint becomes the next starting point, and the calculation repeats.</text>
</svg>
