<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A matrix as stacked football prediction recipes</title>
  <desc id="desc">Angle and speed form one state vector. Two rows use different weights to produce a clearance signal and a target-height signal. One row is one dot product; stacked rows form a matrix.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#60797b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#061923" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#eaf1eb"/>
  <rect width="1600" height="128" fill="#082d3c"/>
  <text x="58" y="38" fill="#f2b83e" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">AFTER WE CAN STORE A STATE</text>
  <text x="58" y="91" fill="#f7faf5" font-family="Georgia, serif" font-size="48" font-weight="700">One dot product is one recipe. A matrix stacks recipes.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="180" width="350" height="520" rx="12" fill="#ffffff" stroke="#9bb0ad" stroke-width="3"/>
    <rect x="465" y="180" width="700" height="520" rx="12" fill="#ffffff" stroke="#9bb0ad" stroke-width="3"/>
    <rect x="1225" y="180" width="320" height="520" rx="12" fill="#ffffff" stroke="#9bb0ad" stroke-width="3"/>
  </g>

  <text x="86" y="225" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">ONE INPUT VECTOR</text>
  <text x="86" y="275" fill="#0b202b" font-family="Georgia, serif" font-size="32" font-weight="700">Current kick state</text>

  <rect x="104" y="340" width="275" height="96" rx="10" fill="#d8eee5" stroke="#4ecf8e" stroke-width="4"/>
  <text x="134" y="378" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">INPUT 1</text>
  <text x="134" y="414" fill="#0b202b" font-family="Consolas, monospace" font-size="25">angle signal  0.4</text>

  <rect x="104" y="475" width="275" height="96" rx="10" fill="#d7edf1" stroke="#43cbd8" stroke-width="4"/>
  <text x="134" y="513" fill="#147f8a" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">INPUT 2</text>
  <text x="134" y="549" fill="#0b202b" font-family="Consolas, monospace" font-size="25">speed signal  0.8</text>

  <text x="86" y="635" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="21">A vector keeps related values</text>
  <text x="86" y="665" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="21">together in a fixed order.</text>

  <line x1="405" y1="388" x2="470" y2="388" stroke="#60797b" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="405" y1="523" x2="470" y2="523" stroke="#60797b" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="505" y="225" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">STACK TWO DOT-PRODUCT RECIPES</text>
  <text x="505" y="275" fill="#0b202b" font-family="Georgia, serif" font-size="32" font-weight="700">Each row listens differently</text>

  <rect x="515" y="330" width="600" height="135" rx="10" fill="#fff4d7" stroke="#f2b83e" stroke-width="4"/>
  <text x="545" y="367" fill="#8d6818" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">ROW 1 · CLEARANCE RECIPE</text>
  <text x="545" y="412" fill="#0b202b" font-family="Consolas, monospace" font-size="26">2.0 × angle  +  0.5 × speed  +  bias</text>
  <text x="545" y="447" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="19">Angle matters strongly; speed matters a little.</text>

  <rect x="515" y="500" width="600" height="135" rx="10" fill="#e1f3f4" stroke="#43cbd8" stroke-width="4"/>
  <text x="545" y="537" fill="#147f8a" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">ROW 2 · TARGET-HEIGHT RECIPE</text>
  <text x="545" y="582" fill="#0b202b" font-family="Consolas, monospace" font-size="26">−0.5 × angle  +  1.5 × speed  +  bias</text>
  <text x="545" y="617" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="19">Angle acts as a brake; speed matters strongly.</text>

  <text x="515" y="676" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="21" font-weight="700">One row = one dot product. Stacked rows = one matrix.</text>

  <line x1="1165" y1="398" x2="1230" y2="398" stroke="#60797b" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1165" y1="568" x2="1230" y2="568" stroke="#60797b" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="1255" y="225" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">ONE OUTPUT VECTOR</text>
  <text x="1255" y="275" fill="#0b202b" font-family="Georgia, serif" font-size="32" font-weight="700">Two answers</text>

  <rect x="1260" y="350" width="245" height="96" rx="10" fill="#fff4d7" stroke="#f2b83e" stroke-width="4"/>
  <text x="1382" y="386" text-anchor="middle" fill="#8d6818" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">CLEARANCE SIGNAL</text>
  <text x="1382" y="425" text-anchor="middle" fill="#0b202b" font-family="Consolas, monospace" font-size="29">1.3</text>

  <rect x="1260" y="520" width="245" height="96" rx="10" fill="#e1f3f4" stroke="#43cbd8" stroke-width="4"/>
  <text x="1382" y="556" text-anchor="middle" fill="#147f8a" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">HEIGHT SIGNAL</text>
  <text x="1382" y="595" text-anchor="middle" fill="#0b202b" font-family="Consolas, monospace" font-size="29">0.8</text>

  <text x="1255" y="665" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="20">These are toy signals,</text>
  <text x="1255" y="693" fill="#5f7478" font-family="Trebuchet MS, sans-serif" font-size="20">not physical metres.</text>

  <rect x="0" y="760" width="1600" height="140" fill="#082d3c"/>
  <text x="58" y="813" fill="#4ecf8e" font-family="Georgia, serif" font-size="34" font-weight="700">The bridge</text>
  <text x="264" y="815" fill="#f7faf5" font-family="Trebuchet MS, sans-serif" font-size="25">Dot product: one recipe. Matrix multiplication: run every stacked recipe together.</text>
  <text x="58" y="862" fill="#a7bdbe" font-family="Trebuchet MS, sans-serif" font-size="20">Rows create outputs. Columns show every route taken by one input.</text>
</svg>
