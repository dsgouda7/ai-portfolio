<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Gravity-only free-kick trajectory</title>
  <desc id="desc">A clean gravity-only arc clears the wall near the top, peaks at 2.18 metres, passes inside the goal, and reaches the back-net target.</desc>
  <defs>
    <marker id="arrow-cyan" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#219ebc"/>
    </marker>
    <marker id="arrow-gold" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d99a16"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#f4f8f5"/>
  <text x="56" y="52" fill="#50666a" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">28 LOCAL UPDATES</text>
  <text x="56" y="92" fill="#102a36" font-family="Georgia, serif" font-size="31" font-weight="700">One launch, one gravity-only arc</text>

  <line x1="80" y1="460" x2="1120" y2="460" stroke="#8fa3a1" stroke-width="2"/>

  <line x1="512" y1="460" x2="512" y2="226" stroke="#102a36" stroke-width="5"/>
  <text x="512" y="495" text-anchor="middle" fill="#102a36" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">WALL · 9.15 m</text>

  <line x1="1000" y1="460" x2="1000" y2="143" stroke="#102a36" stroke-width="5"/>
  <line x1="1000" y1="143" x2="1110" y2="143" stroke="#102a36" stroke-width="5"/>
  <text x="1000" y="128" text-anchor="middle" fill="#102a36" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">GOAL LINE · 20 m</text>

  <path d="M100 460C275 279 470 187 653 176C817 176 954 239 1068 317" fill="none" stroke="#58777a" stroke-width="4" stroke-linecap="round"/>

  <g fill="#219ebc" stroke="#102a36" stroke-width="1.5">
    <circle cx="100" cy="460" r="5"/>
    <circle cx="238" cy="339" r="5"/>
    <circle cx="376" cy="251" r="5"/>
    <circle cx="515" cy="197" r="5"/>
    <circle cx="653" cy="176" r="5"/>
    <circle cx="791" cy="190" r="5"/>
    <circle cx="929" cy="236" r="5"/>
  </g>

  <line x1="100" y1="460" x2="136" y2="460" stroke="#219ebc" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <line x1="136" y1="460" x2="136" y2="421" stroke="#d99a16" stroke-width="3" marker-end="url(#arrow-gold)"/>
  <text x="155" y="430" fill="#126f83" font-family="Trebuchet MS, sans-serif" font-size="17" font-weight="700">first tiny move</text>

  <line x1="480" y1="157" x2="512" y2="192" stroke="#36b37e" stroke-width="2"/>
  <text x="470" y="151" text-anchor="end" fill="#207a57" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">wall clearance · 2.02 m</text>

  <line x1="680" y1="151" x2="656" y2="172" stroke="#50666a" stroke-width="2"/>
  <text x="690" y="145" fill="#102a36" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">peak · 2.18 m</text>
  <text x="690" y="168" fill="#50666a" font-family="Trebuchet MS, sans-serif" font-size="16">only 0.16 m above wall clearance</text>

  <circle cx="1068" cy="317" r="9" fill="#36b37e" stroke="#102a36" stroke-width="2"/>
  <text x="1045" y="350" text-anchor="end" fill="#207a57" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">TARGET · 21.5 m, 1.10 m</text>
  <text x="970" y="270" text-anchor="end" fill="#207a57" font-family="Trebuchet MS, sans-serif" font-size="17" font-weight="700">inside goal</text>
</svg>
