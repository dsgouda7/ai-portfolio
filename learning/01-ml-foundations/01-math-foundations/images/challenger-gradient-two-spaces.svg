<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Challenger Deep gradient descent uses two different spaces</title>
  <desc id="desc">The left panel shows the probe moving through physical ocean depth. The right panel shows thrust moving through parameter space along a mission-loss curve. A local derivative links the decision, but the movements are different.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#126177"/>
      <stop offset="0.48" stop-color="#063243"/>
      <stop offset="1" stop-color="#03131f"/>
    </linearGradient>
    <marker id="cyan-arrow" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="22" refY="12" orient="auto"><path d="M0,0 L24,12 L0,24 z" fill="#47cfda"/></marker>
    <marker id="gold-arrow" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="22" refY="12" orient="auto"><path d="M0,0 L24,12 L0,24 z" fill="#f3b83d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#061923" flood-opacity="0.25"/></filter>
  </defs>

  <rect width="1600" height="900" fill="#eaf1eb"/>
  <rect width="1600" height="128" fill="#082d3c"/>
  <text x="58" y="38" fill="#f3b83d" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">BEFORE PLAYING THE MISSION</text>
  <text x="58" y="91" fill="#f7faf5" font-family="Georgia, serif" font-size="47" font-weight="700">One turn contains a parameter step and a physical step</text>

  <g filter="url(#shadow)">
    <rect x="55" y="170" width="690" height="545" rx="12" fill="url(#ocean)" stroke="#8da7a6" stroke-width="3"/>
    <rect x="855" y="170" width="690" height="545" rx="12" fill="#ffffff" stroke="#8da7a6" stroke-width="3"/>
  </g>

  <text x="90" y="217" fill="#f3b83d" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">SPACE 1 · PHYSICAL OCEAN</text>
  <text x="90" y="265" fill="#f7faf5" font-family="Georgia, serif" font-size="34" font-weight="700">The probe changes depth</text>
  <text x="90" y="305" fill="#b8ced0" font-family="Trebuchet MS, sans-serif" font-size="21">Measured in metres below the surface</text>

  <line x1="210" y1="345" x2="210" y2="650" stroke="#dbeae6" stroke-width="4"/>
  <line x1="195" y1="345" x2="225" y2="345" stroke="#dbeae6" stroke-width="4"/>
  <line x1="195" y1="650" x2="225" y2="650" stroke="#f3b83d" stroke-width="6"/>
  <text x="175" y="352" text-anchor="end" fill="#b8ced0" font-family="Trebuchet MS, sans-serif" font-size="17">surface</text>
  <text x="175" y="657" text-anchor="end" fill="#f3b83d" font-family="Trebuchet MS, sans-serif" font-size="17" font-weight="700">10,900 m</text>

  <g transform="translate(210 430)">
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="#c8d3ca" stroke="#f7faf5" stroke-width="4"/>
    <rect x="-70" y="-15" width="18" height="30" fill="#66878a"/>
    <circle cx="27" cy="-2" r="10" fill="#47cfda" stroke="#f7faf5" stroke-width="3"/>
    <line x1="-18" y1="22" x2="-28" y2="42" stroke="#a7bdb8" stroke-width="5"/>
    <line x1="18" y1="22" x2="28" y2="42" stroke="#a7bdb8" stroke-width="5"/>
  </g>
  <line x1="210" y1="474" x2="210" y2="555" stroke="#47cfda" stroke-width="12" marker-end="url(#cyan-arrow)"/>
  <text x="260" y="520" fill="#47cfda" font-family="Trebuchet MS, sans-serif" font-size="23" font-weight="700">physical move</text>
  <text x="90" y="688" fill="#f7faf5" font-family="Trebuchet MS, sans-serif" font-size="22">This move changes depth, pressure, and the next situation.</text>

  <text x="890" y="217" fill="#f3b83d" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">SPACE 2 · PARAMETER SPACE</text>
  <text x="890" y="265" fill="#0b202b" font-family="Georgia, serif" font-size="34" font-weight="700">The control changes mission score</text>
  <text x="890" y="305" fill="#60797b" font-family="Trebuchet MS, sans-serif" font-size="21">Horizontal: thrust control · Vertical: mission score</text>

  <line x1="930" y1="650" x2="1495" y2="650" stroke="#60797b" stroke-width="3"/>
  <line x1="930" y1="650" x2="930" y2="350" stroke="#60797b" stroke-width="3"/>
  <path d="M955 405 C1085 470 1165 520 1230 545 C1310 575 1400 565 1480 480" fill="none" stroke="#ee6a55" stroke-width="8"/>
  <circle cx="1110" cy="490" r="12" fill="#4fd390" stroke="#082d3c" stroke-width="4"/>
  <text x="1078" y="462" text-anchor="end" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">NOW</text>
  <line x1="1035" y1="448" x2="1255" y2="540" stroke="#f3b83d" stroke-width="7"/>

  <line x1="1110" y1="490" x2="1205" y2="490" stroke="#47cfda" stroke-width="12" marker-end="url(#cyan-arrow)"/>
  <line x1="1205" y1="490" x2="1205" y2="532" stroke="#f3b83d" stroke-width="12" marker-end="url(#gold-arrow)"/>
  <circle cx="1205" cy="532" r="10" fill="#f7faf5" stroke="#082d3c" stroke-width="3"/>
  <text x="1223" y="557" fill="#257b56" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700">NEXT</text>
  <text x="890" y="682" fill="#0b202b" font-family="Trebuchet MS, sans-serif" font-size="20">The derivative guides this move. Physical depth has not changed yet.</text>

  <rect x="0" y="760" width="1600" height="140" fill="#082d3c"/>
  <text x="58" y="813" fill="#4fd390" font-family="Georgia, serif" font-size="34" font-weight="700">The order</text>
  <text x="246" y="815" fill="#f7faf5" font-family="Trebuchet MS, sans-serif" font-size="25">Measure slope → move control a little → check the plan → move the probe</text>
  <text x="58" y="862" fill="#a7bdbe" font-family="Trebuchet MS, sans-serif" font-size="20">Gradient descent happens in parameter space. The descent vehicle moves afterward in the ocean.</text>
</svg>
