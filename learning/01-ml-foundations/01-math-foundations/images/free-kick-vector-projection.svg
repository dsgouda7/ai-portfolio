<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Useful projection of the launch onto the target direction</title>
  <desc id="desc">A cyan launch arrow projects onto a dashed target guide. The green projected length is 0.960 of the unit launch arrow.</desc>
  <defs>
    <marker id="arrow-cyan" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#219ebc"/>
    </marker>
    <marker id="arrow-gold" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d99a16"/>
    </marker>
  </defs>

  <rect width="1000" height="400" fill="#f4f8f5"/>

  <circle cx="105" cy="295" r="8" fill="#ffffff" stroke="#102a36" stroke-width="3"/>

  <line x1="105" y1="295" x2="900" y2="255" stroke="#d99a16" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#arrow-gold)"/>
  <text x="700" y="320" fill="#8a6413" font-family="Trebuchet MS, sans-serif" font-size="20" font-weight="700">target direction · 2.93°</text>

  <line x1="105" y1="295" x2="780" y2="61" stroke="#219ebc" stroke-width="4" marker-end="url(#arrow-cyan)"/>
  <text x="455" y="88" fill="#126f83" font-family="Trebuchet MS, sans-serif" font-size="21" font-weight="700">launch · 19.11°</text>

  <line x1="780" y1="61" x2="791" y2="261" stroke="#718487" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="M771 243L790 242L791 261" fill="none" stroke="#718487" stroke-width="2"/>

  <line x1="105" y1="295" x2="791" y2="261" stroke="#36b37e" stroke-width="6"/>
  <circle cx="791" cy="261" r="6" fill="#36b37e"/>
  <text x="360" y="360" fill="#207a57" font-family="Trebuchet MS, sans-serif" font-size="22" font-weight="700">useful projection · 0.960</text>
</svg>
